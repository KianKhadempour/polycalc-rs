[package]
name = "polycalc-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "combat_core"
path = "src/lib.rs"

[[bin]]
name = "polycalc"
path = "src/bin.rs"

[[bench]]
name = "bench_damage"
harness = false

[dependencies]
bitflags = "2.11.0"
indexmap = { version = "2.13.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "1.15.1"
thiserror = "2.0.18"
toml = "1.0.4"

[dev-dependencies]
criterion = "0.8.2"
